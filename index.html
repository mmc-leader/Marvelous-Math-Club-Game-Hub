<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Math Club Game Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6e3;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2aa198;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
    h1 {
      margin: 0;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin: 1rem;
    }
    .filters select {
      font-size: 1rem;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .game-card {
      background: white;
      border: 2px solid #ccc;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    .game-card:hover {
      transform: scale(1.03);
    }
    .game-card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }
    .game-card a {
      display: inline-block;
      margin-top: 0.5rem;
      background: #268bd2;
      color: white;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 6px;
    }
    .game-card a:hover {
      background: #1c6fa5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Math Club Game Hub</h1>
    <p>Explore fun, distraction-free math games by grade and topic!</p>
  </header>

  <div class="filters">
    <select id="gradeFilter">
      <option value="all">All Grades</option>
      <option value="K">Kindergarten</option>
      <option value="1">Grade 1</option>
      <option value="2">Grade 2</option>
      <option value="3">Grade 3</option>
      <option value="4">Grade 4</option>
      <option value="5">Grade 5</option>
    </select>

    <select id="topicFilter">
      <option value="all">All Topics</option>
      <option value="counting">Counting</option>
      <option value="addition">Addition & Subtraction</option>
      <option value="multiplication">Multiplication & Division</option>
      <option value="fractions">Fractions</option>
      <option value="geometry">Geometry</option>
      <option value="measurement">Measurement</option>
    </select>
  </div>

  <div class="game-grid" id="gameGrid"></div>
