<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marvelous Math Club Game Hub</title>
  <script src="https://kit.fontawesome.com/a2e0e6b41c.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap');


body {
  font-family: 'Comic Neue', 'Fredoka', cursive;
  background: #e6f7ff;
  margin: 0;
  padding: 0;
}

header {
  background: #007acc;
  color: white;
  text-align: center;
  padding: 1.2rem 0;
}

`  {
  margin: 0;
  font-size: 2.5rem;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  margin: 1rem;
}

.filters select {
  font-size: 1rem;
  padding: 0.5rem;
  border-radius: 8px;
  border: 1px solid #aaa;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
  padding: 1rem;
}

.game-card {
  background: white;
  border: 2px solid #b3d7ff;
  border-radius: 16px;
  padding: 1rem;
  text-align: center;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
  transition: transform 0.2s ease;
}

.game-card:hover {
  transform: scale(1.03);
}

.game-card img {
  width: 100%;
  height: 150px;
  object-fit: contain;
  margin-bottom: 0.5rem;
}

.game-card a {
  display: inline-block;
  margin-top: 0.5rem;
  background: #00bcd4;
  color: white;
  padding: 0.5rem 1rem;
  text-decoration: none;
  border-radius: 6px;
}

.game-card a:hover {
  background: #0097a7;
}

@media (max-width: 600px) {
  header {
    padding: 1rem 0.5rem;
  }

  h1 {
    font-size: 2rem;
  }

  .filters {
    flex-direction: column;
    align-items: center;
  }

  .filters select {
    width: 90%;
    max-width: 300px;
    font-size: 1.1rem;
    padding: 0.6rem;
  }

  .game-card {
    padding: 1rem 0.5rem;
  }

  .game-card a {
    font-size: 1.1rem;
    padding: 0.6rem 1.2rem;
  }
}

  </style>
</head>
<body>
  <header>
    <h1>Marvelous Math Club Game Hub</h1>
    <p>Explore fun, distraction-free math games by grade and topic!</p>
  </header>

  <div class="filters">
    <select id="gradeFilter">
      <option value="all">All Grades</option>
      <option value="K">Kindergarten</option>
      <option value="1">Grade 1</option>
      <option value="2">Grade 2</option>
      <option value="3">Grade 3</option>
      <option value="4">Grade 4</option>
      <option value="5">Grade 5</option>
    </select>

    <select id="topicFilter">
      <option value="all">All Topics</option>
      <option value="counting">Counting</option>
      <option value="addition">Addition & Subtraction</option>
      <option value="multiplication">Multiplication & Division</option>
      <option value="fractions">Fractions</option>
      <option value="geometry">Geometry</option>
      <option value="measurement">Measurement</option>
    </select>
  </div>

  <div class="game-grid" id="gameGrid"></div>

  <script>
    const games = [
      {
        title: "Toy Theater: Counting",
        grade: ["K", "1"],
        topic: "counting",
        url: "https://toytheater.com/counting/",
        img: "https://toytheater.com/wp-content/uploads/CountingCaterpillar200.png"
      },
      {
        title: "Alien Addition",
        grade: ["1", "2"],
        topic: "addition",
        url: "https://www.arcademics.com/games/alien-addition",
        img: "https://www.arcademics.com/assets/img/games/alien-addition.png"
      },
      {
        title: "Penguin Jump",
        grade: ["2", "3"],
        topic: "addition",
        url: "https://www.mathplayground.com/ASB_PenguinJump.html",
        img: "https://www.mathplayground.com/pg_penguin_jump.png"
      },
      {
        title: "Meteor Multiplication",
        grade: ["3", "4"],
        topic: "multiplication",
        url: "https://www.arcademics.com/games/meteor-multiplication",
        img: "https://www.arcademics.com/assets/img/games/meteor-multiplication.png"
      },
      {
        title: "Ducky Race",
        grade: ["4", "5"],
        topic: "multiplication",
        url: "https://www.mathplayground.com/ASB_DuckyRace.html",
        img: "https://www.mathplayground.com/pg_ducky_race.png"
      },
      {
        title: "Shape Builder",
        grade: ["K", "1", "2"],
        topic: "geometry",
        url: "https://toytheater.com/shapes/",
        img: "https://toytheater.com/wp-content/uploads/ShapeBuilder200.png"
      },
      {
        title: "Area & Perimeter",
        grade: ["3", "4", "5"],
        topic: "measurement",
        url: "https://www.mathplayground.com/area_perimeter.html",
        img: "https://www.mathplayground.com/pg_area_perimeter.png"
      }
    ];

    const gameGrid = document.getElementById('gameGrid');
    const gradeFilter = document.getElementById('gradeFilter');
    const topicFilter = document.getElementById('topicFilter');

    function renderGames() {
      const selectedGrade = gradeFilter.value;
      const selectedTopic = topicFilter.value;

      const filtered = games.filter(game => {
        const matchGrade = selectedGrade === "all" || game.grade.includes(selectedGrade);
        const matchTopic = selectedTopic === "all" || game.topic === selectedTopic;
        return matchGrade && matchTopic;
      });

      gameGrid.innerHTML = filtered.length
  ? filtered.map(game => `
      <div class="game-card">
        <img src="${game.img}" alt="${game.title}" onerror="this.src='https://raw.githubusercontent.com/mmc-leader/Marvelous-Math-Club-Game-Hub/refs/heads/main/math.png'; this.onerror=null;">
        <h3>${game.title}</h3>
        <a href="${game.url}" target="_blank">
  <i class="fas fa-gamepad" style="margin-right: 6px;"></i>Play
</a>
      </div>
    `).join('')

        : '<p style="text-align:center; grid-column: 1 / -1;">No games found for your filters.</p>';
    }

    gradeFilter.addEventListener('change', renderGames);
    topicFilter.addEventListener('change', renderGames);

    // Initial render
    renderGames();
  </script>
</body>
</html>
