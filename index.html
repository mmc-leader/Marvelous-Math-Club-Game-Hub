<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Club Game Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f8f9fa;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .grade-section {
      margin: 2rem 0;
    }
    .grade-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #2980b9;
      border-bottom: 2px solid #2980b9;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .game-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 1rem;
      transition: transform 0.2s;
    }
    .game-card:hover {
      transform: scale(1.03);
    }
    .game-card img {
      width: 64px;
      height: 64px;
    }
    .game-card h3 {
      margin: 0.5rem 0 0;
      font-size: 1.1rem;
      color: #333;
    }
    .surprise-btn {
      display: block;
      margin: 1rem auto 2rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .surprise-btn:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>
  <h1>Math Club Game Hub</h1>
  <button class="surprise-btn" onclick="surpriseMe()">🎲 Surprise Me!</button>
  <div id="games-container"></div>

  <script>
    const games = [
      // Kindergarten
      { title: "Counting Fish", url: "https://www.abcya.com/games/counting_fish", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f41f.png", grade: "K", topic: "Counting" },
      { title: "Number Match", url: "https://www.abcya.com/games/number_match", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f522.png", grade: "K", topic: "Number Recognition" },
      { title: "Feed the Monster", url: "https://www.abcya.com/games/feed_the_monster", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f47e.png", grade: "K", topic: "Counting & Shapes" },

      // Grade 1
      { title: "Number Bingo", url: "https://www.abcya.com/games/number_bingo", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3b2.png", grade: "1", topic: "Number Recognition" },
      { title: "Fuzz Bugs Counting", url: "https://www.abcya.com/games/fuzz_bugs_counting_sorting", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f41e.png", grade: "1", topic: "Counting & Sorting" },
      { title: "Tug Team Addition", url: "https://www.mathplayground.com/ASB_TugTeamAddition.html", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f91d.png", grade: "1", topic: "Addition" },

      // Grade 2
      { title: "Base Ten Bingo", url: "https://www.abcya.com/games/base-ten-bingo", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f522.png", grade: "2", topic: "Place Value" },
      { title: "Math Mahjong: Addition", url: "https://www.abcya.com/games/math_mahjong", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f004.png", grade: "2", topic: "Addition" },
      { title: "Telling Time", url: "https://www.abcya.com/games/telling_time", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/23f0.png", grade: "2", topic: "Time" },

      // Grade 3
      { title: "Pizza Fractions", url: "https://www.abcya.com/games/pizza_fractions", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f355.png", grade: "3", topic: "Fractions" },
      { title: "Rounding Rockets", url: "https://www.mathplayground.com/rocket_rounding.html", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f680.png", grade: "3", topic: "Rounding" },
      { title: "Math Monster Multiplication", url: "https://www.mathplayground.com/math_monster_multiplication.html", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f47b.png", grade: "3", topic: "Multiplication" },

      // Grade 4
      { title: "Factor Pair Up", url: "https://www.mathplayground.com/factor_pair_up.html", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/267b.png", grade: "4", topic: "Factors" },
      { title: "Math Lines Division", url: "https://www.coolmathgames.com/0-math-lines", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2796.png", grade: "4", topic: "Division" },
      { title: "Integer Warp", url: "https://www.arcademics.com/games/integers", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3c3.png", grade: "4", topic: "Negative Numbers" },

      // Grade 5
      { title: "Math Surpass", url: "https://www.mathplayground.com/ASB_MathSurpass.html", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3c6.png", grade: "5", topic: "Mixed Operations" },
      { title: "Decimals of the Caribbean", url: "https://www.arcademics.com/games/decimal-cards", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3f3.png", grade: "5", topic: "Decimals" },
      { title: "Battleship Numberline", url: "https://www.mathsnacks.com/battleship-numberline.html", img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f6a2.png", grade: "5", topic: "Number Lines" }
    ];

    function renderGames() {
      const container = document.getElementById("games-container");
      container.innerHTML = "";
      const grouped = games.reduce((acc, game) => {
        acc[game.grade] = acc[game.grade] || [];
        acc[game.grade].push(game);
        return acc;
      }, {});

      for (const grade in grouped) {
        const section = document.createElement("div");
        section.className = "grade-section";
        section.innerHTML = `<div class="grade-title">Grade ${grade}</div>`;
        const grid = document.createElement("div");
        grid.className = "game-grid";

        grouped[grade].forEach((game) => {
          const card = document.createElement("div");
          card.className = "game-card";
          card.innerHTML = `
            <a href="${game.url}" target="_blank">
              <img src="${game.img}" alt="${game.topic}" />
              <h3>${game.title}</h3>
            </a>`;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    function surpriseMe() {
      const randomGame = games[Math.floor(Math.random() * games.length)];
      window.open(randomGame.url, "_blank");
    }

    renderGames();
  </script>
</body>
</html>
